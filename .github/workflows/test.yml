name: Tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
      - name: Install locked dependencies
        run: corepack pnpm install --ignore-scripts --frozen-lockfile
      - name: Studio tests
        working-directory: apps/studio
        run: corepack pnpm exec vitest run --maxWorkers=2
      - name: SVM client tests
        working-directory: packages/svm
        run: corepack pnpm exec vitest run --maxWorkers=2
      - name: Static production build
        working-directory: apps/studio
        run: corepack pnpm exec next build
